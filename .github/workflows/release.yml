name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build registry
        run: node scripts/publish.mjs
      - name: Validate generated registry and artifacts
        run: node scripts/validate.mjs --no-sig --tolerate-network
      - name: Sign registry
        env:
          MARKET_PRIVATE_KEY: ${{ secrets.MARKET_PRIVATE_KEY }}
        run: node scripts/sign.mjs --key-env MARKET_PRIVATE_KEY
      - name: Verify signature
        run: node scripts/validate.mjs --pub keys/market-public.pem --skip-artifacts
      - name: Stage site
        run: |
          mkdir -p site
          cp registry.json registry.json.sig site/
          cp -r icons site/icons
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed registry
        run: |
          base=https://sadami3066.github.io/deepdeep-market
          for attempt in $(seq 1 30); do
            curl -fsSL "$base/registry.json" -o /tmp/live-registry.json || true
            curl -fsSL "$base/registry.json.sig" -o /tmp/live-registry.json.sig || true
            if cmp -s /tmp/live-registry.json registry.json; then
              break
            fi
            sleep 10
          done
          cmp /tmp/live-registry.json registry.json
          node scripts/validate.mjs --in /tmp/live-registry.json --sig /tmp/live-registry.json.sig --pub keys/market-public.pem --skip-artifacts
